spring:
  application:
    name: veterinary-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL READ COMMITTED"
      # No pongas SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE / SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
      # como variables de entorno reales (Cloud Run, OS env): Spring las bindea sobre HikariDataSource
      # con el mismo prefijo que ya usa connection-init-sql arriba, pero viniendo de OTRA fuente de
      # propiedades (el entorno del SO, de mayor precedencia que este archivo). Eso hace que el Binder
      # de Spring, al resolver "connection-timeout", termine invocando el getter sin argumentos
      # HikariDataSource.getConnection() (colisiona con el patrón de nombre de bean property "connection"
      # que expone la interfaz DataSource) -- abriendo una conexión real y SELLANDO el pool a mitad de la
      # configuración, antes de que se pueda aplicar connection-init-sql: "IllegalStateException: The
      # configuration of the pool is sealed once started". Confirmado con un debugger (stack trace real:
      # JavaBeanBinder$BeanProperty.getValue -> HikariDataSource.getConnection -> HikariConfig.seal).
      # Por eso estos dos valores viven ACÁ, en el mismo archivo que connection-init-sql (una sola fuente
      # de propiedades para todo el prefijo spring.datasource.hikari), tomando el valor de variables con
      # OTRO nombre que nunca chocan con ese prefijo.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:8000}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  config:
    import: optional:file:.env[.properties]

  cloud:
    gcp:
      core:
        enabled: ${EVENTS_ENABLED:true}
      pubsub:
        enabled: ${EVENTS_ENABLED:true}
      project-id: ${GCP_PROJECT_ID:}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI}

server:
  # Cloud Run inyecta PORT y manda; en local sigue valiendo SERVER_PORT del .env, y si
  # no hay ninguna de las dos, 8082.
  port: ${PORT:${SERVER_PORT:8082}}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}

app:
  base-url: ${APP_BASE_URL}
  invitation:
    base-url: ${INVITATION_BASE_URL:}
  link:
    # Pantalla del frontend que recibe el código de vinculación de un dueño de mascotas.
    # Vacía = el inviteLink que ve la clínica sale como "?code=XXXXXXXX" sin dominio (inservible);
    # el código en sí sigue funcionando si se escribe a mano en la app.
    base-url: ${LINK_BASE_URL:}
  events:
    enabled: ${EVENTS_ENABLED:true}
  security:
    issuer: myanimalog-user-service
    audience: myanimalog-api
    internal-api-key: ${INTERNAL_API_KEY}
  storage:
    logos-bucket: veterinary-logos
    verification-bucket: verification-documents
  support-email: ${SUPPORT_EMAIL:}
  ai:
    verification-enabled: ${AI_VERIFICATION_ENABLED:false}
    service-url: ${IA_SERVICE_URL:}
  legal:
    data-policy-version: ${LEGAL_DATA_POLICY_VERSION:2026-10-v1}
    terms-version: ${LEGAL_TERMS_VERSION:2026-10-v1}
  user-service:
    base-url: ${USER_SERVICE_URL:}
  verification:
    rues-url: ${RUES_URL:https://www.rues.org.co/}
    comvezcol-url: ${COMVEZCOL_URL:https://consejoprofesionalmvz.gov.co/consulta-de-profesionales/}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never