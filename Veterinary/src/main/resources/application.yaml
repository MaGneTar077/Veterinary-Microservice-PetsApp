spring:
  application:
    name: veterinary-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL READ COMMITTED"

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  config:
    import: optional:file:.env[.properties]

  cloud:
    gcp:
      core:
        enabled: ${EVENTS_ENABLED:true}
      pubsub:
        enabled: ${EVENTS_ENABLED:true}
      project-id: ${GCP_PROJECT_ID:}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI}

server:
  port: ${SERVER_PORT:8082}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}

app:
  base-url: ${APP_BASE_URL}
  events:
    enabled: ${EVENTS_ENABLED:true}
  security:
    issuer: myanimalog-user-service
    audience: myanimalog-api
    internal-api-key: ${INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never